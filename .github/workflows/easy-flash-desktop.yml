# AI: below workflow was generated by an AI
name: Easy Flash desktop packages

on:
  pull_request:
    paths:
      - '.github/workflows/easy-flash-desktop.yml'
      - 'easy-flash/**'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches:
      - contrib/easy-flash
    paths:
      - '.github/workflows/easy-flash-desktop.yml'
      - 'easy-flash/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
            target: mac
            artifactPath: dist/easy-flash-desktop/
          - name: Windows x64
            os: windows-2022
            target: win
            artifactPath: dist/easy-flash-desktop/
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run repository tests
        run: npm test

      - name: Run Easy Flash tests
        run: npm run test:easy-flash

      - name: Package unsigned macOS application
        if: runner.os == 'macOS'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:easy-flash:mac

      - name: Package unsigned Windows x64 application
        if: runner.os == 'Windows'
        run: npm run dist:easy-flash:win

      - name: Upload desktop packages
        uses: actions/upload-artifact@v4
        with:
          name: easy-flash-${{ matrix.target }}
          path: ${{ matrix.artifactPath }}
          if-no-files-found: error
# AI: end
