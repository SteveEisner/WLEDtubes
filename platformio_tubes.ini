[tubes_no_mic]
; these settings create a basic template for tubes build from
; from which all other tube envs should build
; the base build does not support
; --  mic (audio reactive)
; -- ir remotes
; For devices with those inputs use the [tubes] settings
; which adds those back in
build_unflags =
  -D CONFIG_ASYNC_TCP_USE_WDT
build_flags =
  -D FASTLED_ALL_PINS_HARDWARE_SPI
  -D ARDUINO_USB_CDC_ON_BOOT=0 ;; this flag is mandatory for "classic ESP32" when building with arduino-esp32 >=2.0.3
  -D WLED_WATCHDOG_TIMEOUT=0
  -D USERMOD_TUBES
  -D CONFIG_ASYNC_TCP_RUNNING_CORE=-1
  ; Disable a bunch of unnecessary integrations
  -D WLED_DISABLE_BLYNK
  -D WLED_DISABLE_MQTT
  -D WLED_DISABLE_LOXONE
  -D WLED_DISABLE_ALEXA
  -D WLED_DISABLE_INFRARED
  -D WLED_DISABLE_CRONIXIE
  -D WLED_DISABLE_HUESYNC
  -D WLED_DISABLE_WEBSOCKETS
  -D WLED_DISABLE_ADALIGHT
  -D WLED_DISABLE_ESPNOW
  -D WLED_DISABLE_SERIAL
  -D IRTYPE=0
custom_usermods = Tubes
lib_ignore =
  IRremoteESP8266

[tubes]
extends = tubes_no_mic
build_flags =
  ${tubes_no_mic.build_flags}
custom_usermods = audioreactive
  Tubes
lib_ignore =


[env:esp32_quinled_diguno]
extends = env:esp32dev
upload_speed = 690000
custom_usermods = audioreactive
build_flags = ${env:esp32dev.build_flags}
  -D RLYPIN=12
  -D BTNPIN=0
  -D DATA_PINS=16
  -D SR_DMTYPE=1
  -D I2S_SDPIN=19
  -D I2S_WSPIN=4
  -D I2S_CKPIN=18
lib_deps = ${env:esp32dev.lib_deps}
board_build.f_flash = 80000000L
board_build.flash_mode = qio

[env:esp32_quinled_dignext2]
;; QuinLED Dig-Next-2 (official pinout/specs)
;; https://quinled.info/dig-next-2/
;; https://quinled.info/dig-next-2-pinout-guide/
;; ESP32, 8MB flash, 2MB PSRAM, dual LED outputs, dual buttons, onboard mic.
extends = env:esp32dev
upload_speed = 690000
custom_usermods = audioreactive
build_flags = ${env:esp32dev.build_flags}
  -D WLED_RELEASE_NAME=\"QUINLED_DIG_NEXT_2\"
  -D WLED_WATCHDOG_TIMEOUT=0
  -D DATA_PINS=2,4
  -D BTNPIN=34,35
  -D RLYPIN=5
  -D SR_DMTYPE=5
  -D I2S_SDPIN=7
  -D I2S_WSPIN=8
  -D I2S_CKPIN=-1
  -D BOARD_HAS_PSRAM -mfix-esp32-psram-cache-issue
lib_deps = ${env:esp32dev.lib_deps}
board_build.partitions = ${esp32.large_partitions}
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.f_flash = 80000000L
board_build.flash_mode = qio
monitor_filters = esp32_exception_decoder

[env:esp32_quinled_dig2go]
; basis quinled dig2go without any tubes support
extends = env:esp32_quinled_diguno
build_unflags = ${env:esp32_quinled_diguno.build_unflags}
  -D WLED_DISABLE_INFRARED
  -D IRTYPE
lib_ignore = ${env:esp32_quinled_diguno.lib_ignore}
lib_deps = ${env:esp32_quinled_diguno.lib_deps}


[env:esp32_quinled_dig2go_tubes]
extends = env:esp32_quinled_dig2go
build_unflags =
  ${tubes.build_unflags}
  ${env:esp32_quinled_dig2go.build_unflags}
  -D WLED_ENABLE_DMX_INPUT -D WLED_RELEASE_NAME=\"ESP32\"
build_flags =
  ${env:esp32_quinled_dig2go.build_flags}
  ${tubes.build_flags}
  -D FASTLED_ESP32_SPI_BUS=HSPI
  -D NUM_STRIPS=1 -D DEFAULT_LED_COUNT=150
  -D PIXEL_COUNTS=150
  -D TUBES_HARDWARE_FAMILY=TubeHardwareDig2Go
  -D TUBES_FIRMWARE_VARIANT=TubeVariantStandard
  # OTA accepts only firmware from the same hardware family, so this identity
  # must override the generic ESP32 release inherited by the Dig2Go base build.
  -D WLED_RELEASE_NAME=\"DIG2GO_TUBES\"
custom_usermods = ${tubes.custom_usermods}
lib_ignore =
  ${env:esp32_quinled_dig2go.lib_ignore}
lib_deps =
  ${env:esp32_quinled_dig2go.lib_deps}

# Explicitly triggered Dig2Go peer propagation. This carries the standard
# DIG2GO_TUBES identity and contains no bench auto-start, PRIME MAC, or
# test-only boot trigger. Its bounded production marker lets a just-migrated
# legacy receiver pass one baton; S3/Easy Flash start seed turns only after
# direct human input.
[env:esp32_quinled_dig2go_tubes_p2p]
extends = env:esp32_quinled_dig2go_tubes
build_flags =
  ${env:esp32_quinled_dig2go_tubes.build_flags}
  -D TUBES_ENABLE_DIG2GO_PEER_PROPAGATION=1
  -D TUBES_DIG2GO_LEGACY_PULL_HOST=1
  -D TUBES_DIG2GO_DYNAMIC_ENROLLMENT=1

[env:esp32_quinled_dignext2_tubes]
extends = env:esp32_quinled_dignext2
build_unflags =
  ${tubes.build_unflags}
  ${env:esp32_quinled_dignext2.build_unflags}
  -D WLED_ENABLE_DMX_INPUT -D WLED_RELEASE_NAME=\"ESP32\"
  -D WLED_RELEASE_NAME=\"QUINLED_DIG_NEXT_2\"
build_flags =
  ${env:esp32_quinled_dignext2.build_flags}
  ${tubes.build_flags}
  -D NUM_STRIPS=2
  -D PIXEL_COUNTS=150,150
  -D WLED_RELEASE_NAME=\"DIGNEXT2_TUBES\"
custom_usermods = ${tubes.custom_usermods}
lib_ignore =
  ${env:esp32_quinled_dignext2.lib_ignore}
lib_deps =
  ${env:esp32_quinled_dignext2.lib_deps}



# ------------------------------------------------------------------------------
# ESP32 S3 Matrix M1
# ------------------------------------------------------------------------------
[env:esp32-s3-matrix-m1]
; builds using the default WLED settings
extends = env:esp32s3dev_8MB_opi
board_build.arduino.memory_type = qio_qspi ;; use with PSRAM: 2MB or  4MB
board_upload.flash_size = 4MB
board_build.partitions = tools/WLED_ESP32_4MB_1MB_FS.csv
build_unflags = ${env:esp32s3dev_8MB_opi.build_unflags}
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MSC_ON_BOOT=0
  -D ARDUINO_DFU_ON_BOOT=0
build_flags = ${common.build_flags} ${esp32s3.build_flags} -D WLED_RELEASE_NAME=ESP32-S3_MATRIX_M1
  -D WLED_WATCHDOG_TIMEOUT=0
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D BOARD_HAS_PSRAM ; tells WLED that PSRAM shall be used
  -D WLED_USE_PSRAM
  -D ABL_MILLIAMPS_DEFAULT=250
  -D NUM_STRIPS=1 -D PIXEL_COUNTS=64 -D DEFAULT_LED_COUNT=64
  -D DEFAULT_LED_COLOR_ORDER=1 -D LEDPIN=14
lib_deps = ${esp32s3.lib_deps}
lib_ignore = ${env:esp32s3dev_8MB_opi.lib_ignore}
  IRremoteESP8266

[env:esp32-s3-matrix-m1_tubes]
extends = env:esp32-s3-matrix-m1
board_build.partitions = tools/WLED_ESP32_4MB_noOTA.csv
build_unflags = ${env:esp32-s3-matrix-m1.build_unflags}
  ${tubes_no_mic.build_unflags}
build_flags =
  ${tubes_no_mic.build_flags}
  ${env:esp32-s3-matrix-m1.build_flags}
  -D IRTYPE=0
  -D FASTLED_ALL_PINS_HARDWARE_SPI
  -D TUBES_HARDWARE_FAMILY=TubeHardwareMatrixM1
custom_usermods = ${tubes_no_mic.custom_usermods}
lib_ignore =
  ${tubes_no_mic.lib_ignore}
  ${env:esp32-s3-matrix-m1.lib_ignore}
lib_deps =
  ${env:esp32-s3-matrix-m1.lib_deps}

# ------------------------------------------------------------------------------
# ESP32 C3 Athom
# ------------------------------------------------------------------------------
[env:esp32-c3-athom]
extends = env:esp32c3dev
lib_ignore = IRremoteESP8266
  ${env:esp32c3dev.lib_ignore}
build_flags = ${env:esp32c3dev.build_flags}
  -D LEDPIN=10
  -D BTNPIN=9
  -D WLED_DISABLE_INFRARED
  -D IRTYPE=0

[env:esp32-c3-athom_tubes]
extends = env:esp32-c3-athom
build_unflags = ${env:esp32-c3-athom.build_unflags}
  ${tubes_no_mic.build_unflags}
build_flags = ${common.build_flags} ${esp32c3.build_flags} -D WLED_RELEASE_NAME=\"ESP32-C3_ATHOM_TUBES\"
  ${tubes_no_mic.build_flags}
  -D FASTLED_ESP32_SPI_BUS=HSPI
  -D NUM_STRIPS=1 -D PIXEL_COUNTS=150 -D DEFAULT_LED_COUNT=150
  -D WLED_WIFI_POWER_SETTING=WIFI_POWER_8_5dBm
  -D LOLIN_WIFI_FIX
  -D TUBES_HARDWARE_FAMILY=TubeHardwareAthomC3
custom_usermods = ${tubes_no_mic.custom_usermods}
lib_ignore = ${env:esp32-c3-athom.lib_ignore}
  ${tubes_no_mic.lib_ignore}
lib_deps =
  ${env:esp32-c3-athom.lib_deps}


# ------------------------------------------------------------------------------
# ESP32 GLEDOPTO
#
# LEDs: GRB @ pin 16
# Button: GPIO 0
# SR:  i2S SD 26, WS 5, SCK 21, MCLK unused
# ------------------------------------------------------------------------------
[env:esp32-gledopto]
extends = env:esp32dev
lib_ignore = IRremoteESP8266
  ${env:esp32c3dev.lib_ignore}   ; ok to keep this line if it exists, harmless
build_flags = ${env:esp32dev.build_flags}
  -D LEDPIN=16
  -D BTNPIN=0
  -D WLED_DISABLE_INFRARED
  -D IRTYPE=0

[env:esp32-gledopto_tubes]
extends = env:esp32-gledopto
build_unflags = ${env:esp32-gledopto.build_unflags}
  ${tubes_no_mic.build_unflags}
build_flags = ${env:esp32-gledopto.build_flags}
  ${tubes_no_mic.build_flags}
  -D FASTLED_ESP32_SPI_BUS=HSPI
  -D NUM_STRIPS=1 -D PIXEL_COUNTS=150 -D DEFAULT_LED_COUNT=150
  -D WLED_WIFI_POWER_SETTING=WIFI_POWER_8_5dBm
  -D LOLIN_WIFI_FIX
  -D TUBES_HARDWARE_FAMILY=TubeHardwareGledopto
custom_usermods = ${tubes_no_mic.custom_usermods}
lib_ignore = ${env:esp32-gledopto.lib_ignore}
  ${tubes_no_mic.lib_ignore}
lib_deps = ${env:esp32-gledopto.lib_deps}
