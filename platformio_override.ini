[platformio]
default_envs = esp32dev
extra_configs =
  platformio_tubes.ini

[env:golden]
extends = env:esp32_quinled_dig2go_tubes
build_unflags =
  ${env:esp32_quinled_dig2go_tubes.build_unflags}
  -D WLED_RELEASE_NAME=\"DIG2GO_TUBES\"
  -D TUBES_FIRMWARE_VARIANT=TubeVariantStandard
build_flags =
  ${env:esp32_quinled_dig2go_tubes.build_flags}
  -D GOLDEN
  -D TUBES_FIRMWARE_VARIANT=TubeVariantGolden
  -D WLED_RELEASE_NAME=\"GOLDEN_TUBES\"

; Offline test sender only. This is the accepted standard Dig2Go identity,
; deliberately separate from the Golden variant above.
[env:dig2go_push_bridge_test]
extends = env:esp32_quinled_dig2go_tubes
build_unflags =
  ${env:esp32_quinled_dig2go_tubes.build_unflags}
  -D WLED_RELEASE_NAME=\"DIG2GO_TUBES\"
  -D TUBES_FIRMWARE_VARIANT=TubeVariantStandard
build_flags =
  ${env:esp32_quinled_dig2go_tubes.build_flags}
  -D TUBES_ENABLE_DIG2GO_PUSH_BRIDGE=1
  -D TUBES_DIG2GO_PUSH_AUTO_TRIGGER=1
  -D TUBES_DIG2GO_LEGACY_PULL_HOST=1
  -D TUBES_DIG2GO_DYNAMIC_ENROLLMENT=1
  -D TUBES_DIG2GO_LEGACY_BOOT_FALLBACK_TEST=1
  -D 'TUBES_DIG2GO_PUSH_PRIME_MAC="5443B2B54980"'
  -D TUBES_FIRMWARE_VARIANT=TubeVariantStandard
  -D WLED_RELEASE_NAME=\"DIG2GO_TUBES_PUSH_TEST\"

; Local physical-test sender: production P2P code at the next release number.
; This environment is review scaffolding only and is not a release target.
[env:dig2go_p2p_release48_test]
extends = env:esp32_quinled_dig2go_tubes_p2p
build_flags =
  ${env:esp32_quinled_dig2go_tubes_p2p.build_flags}
  -D RELEASE_VERSION=48

; Previous-release peer used to prove Steve's FleetUpdateOffer path upgrades a
; current Dig2Go and carries the durable propagation lease through reboot.
[env:dig2go_p2p_release47_test]
extends = env:esp32_quinled_dig2go_tubes_p2p
build_flags =
  ${env:esp32_quinled_dig2go_tubes_p2p.build_flags}
  -D RELEASE_VERSION=47

[env:christmas]
extends = env:esp32_quinled_dig2go_tubes
build_unflags =
  ${env:esp32_quinled_dig2go_tubes.build_unflags}
  -D WLED_RELEASE_NAME=\"DIG2GO_TUBES\"
  -D TUBES_FIRMWARE_VARIANT=TubeVariantStandard
build_flags =
  ${env:esp32_quinled_dig2go_tubes.build_flags}
  -D CHRISTMAS
  -D TUBES_FIRMWARE_VARIANT=TubeVariantChristmas
  -D WLED_RELEASE_NAME=\"CHRISTMAS_TUBES\"

[env:ruby]
extends = env:esp32_quinled_dig2go_tubes
build_flags =
  ${env:esp32_quinled_dig2go_tubes.build_flags}
  -D RUBY

[env:mauve]
extends = env:esp32_quinled_dig2go_tubes
build_flags =
  ${env:esp32_quinled_dig2go_tubes.build_flags}
  -D MAUVE


[env:master]
extends = env:esp32_quinled_dig2go_tubes
build_flags =
  ${env:esp32_quinled_dig2go_tubes.build_flags}
  -D MASTER

[env:HOMELIGHT]
extends = env:esp32dev
build_unflags =
  ${env:esp32dev.build_unflags}
  ${tubes_no_mic.build_unflags}
  -D WLED_RELEASE_NAME=\"ESP32\"
build_flags =
  ${env:esp32dev.build_flags}
  ${tubes_no_mic.build_flags}
  -D WLED_RELEASE_NAME=\"ESP32_HOMELIGHT\"
  -D HOMELIGHT
  -D TUBES_HARDWARE_FAMILY=TubeHardwareHomeLight
  -D WLED_ESPNOW_WIFI_CHANNEL=1
custom_usermods = ${tubes_no_mic.custom_usermods}
lib_ignore =
  ${env:esp32dev.lib_ignore}
  ${tubes_no_mic.lib_ignore}
lib_deps = ${env:esp32dev.lib_deps}
