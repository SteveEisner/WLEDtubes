[platformio]
default_envs = esp32dev
extra_configs =
  platformio_tubes.ini

[env:golden]
extends = env:esp32_quinled_dig2go_tubes
build_unflags =
  ${env:esp32_quinled_dig2go_tubes.build_unflags}
  -D WLED_RELEASE_NAME=\"DIG2GO_TUBES\"
  -D TUBES_FIRMWARE_VARIANT=TubeVariantStandard
build_flags =
  ${env:esp32_quinled_dig2go_tubes.build_flags}
  -D GOLDEN
  -D TUBES_FIRMWARE_VARIANT=TubeVariantGolden
  -D WLED_RELEASE_NAME=\"GOLDEN_TUBES\"

[env:christmas]
extends = env:esp32_quinled_dig2go_tubes
build_unflags =
  ${env:esp32_quinled_dig2go_tubes.build_unflags}
  -D WLED_RELEASE_NAME=\"DIG2GO_TUBES\"
  -D TUBES_FIRMWARE_VARIANT=TubeVariantStandard
build_flags =
  ${env:esp32_quinled_dig2go_tubes.build_flags}
  -D CHRISTMAS
  -D TUBES_FIRMWARE_VARIANT=TubeVariantChristmas
  -D WLED_RELEASE_NAME=\"CHRISTMAS_TUBES\"

[env:ruby]
extends = env:esp32_quinled_dig2go_tubes
build_flags =
  ${env:esp32_quinled_dig2go_tubes.build_flags}
  -D RUBY

[env:mauve]
extends = env:esp32_quinled_dig2go_tubes
build_flags =
  ${env:esp32_quinled_dig2go_tubes.build_flags}
  -D MAUVE


[env:master]
extends = env:esp32_quinled_dig2go_tubes
build_flags =
  ${env:esp32_quinled_dig2go_tubes.build_flags}
  -D MASTER

[env:HOMELIGHT]
extends = env:esp32dev
build_unflags =
  ${env:esp32dev.build_unflags}
  ${tubes_no_mic.build_unflags}
  -D WLED_RELEASE_NAME=\"ESP32\"
build_flags =
  ${env:esp32dev.build_flags}
  ${tubes_no_mic.build_flags}
  -D WLED_RELEASE_NAME=\"ESP32_HOMELIGHT\"
  -D HOMELIGHT
  -D TUBES_HARDWARE_FAMILY=TubeHardwareHomeLight
  -D WLED_ESPNOW_WIFI_CHANNEL=1
custom_usermods = ${tubes_no_mic.custom_usermods}
lib_ignore =
  ${env:esp32dev.lib_ignore}
  ${tubes_no_mic.lib_ignore}
lib_deps = ${env:esp32dev.lib_deps}
